<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C1432E">
<title>ראש השנה שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>🍎 ראש השנה שלנו 🍯</h1>
  <p>מה מכינים ומה עוד צריך לקנות</p>
  <div class="sync-row">
    <span class="sync-status" id="syncStatus">טוען…</span>
    <button class="refresh-btn" id="refreshBtn">↻ רענון</button>
  </div>
</header>

<main>

  <!-- MENU -->
  <section class="card">
    <h2>🍽️ מה אנחנו מכינים</h2>
    <form id="menuForm" class="inline-form">
      <input id="menuInput" type="text" placeholder="לדוגמה: בשר, אורז, סלט, חלות…" autocomplete="off" required>
      <button type="submit" class="btn btn-primary">＋ הוסף לתפריט</button>
    </form>
    <ul class="plain-list" id="menuList"></ul>
    <p class="empty-msg" id="menuEmpty">עדיין לא הוספתם כלום לתפריט</p>
  </section>

  <!-- ADD TO SHOPPING -->
  <section class="card">
    <h2>🛒 מה צריך לקנות</h2>
    <form id="shopForm" class="stack-form">
      <input id="shopName" type="text" placeholder="שם המוצר, לדוגמה: עגבניות" autocomplete="off" required>
      <div class="row-2">
        <input id="shopQty" type="number" step="any" placeholder="כמות, לדוגמה: 5">
        <input id="shopUnit" type="text" placeholder="יחידה (לא חובה)">
      </div>
      <button type="submit" class="btn btn-primary btn-block">＋ הוסף לקניות</button>
    </form>
  </section>

  <!-- SHOPPING LIST -->
  <section class="card">
    <h3 class="group-title">🛒 נשאר לקנות</h3>
    <ul class="shop-list" id="todoList"></ul>
    <p class="empty-msg" id="todoEmpty">אין כרגע מה לקנות</p>

    <h3 class="group-title done-title">✅ כבר קנינו</h3>
    <ul class="shop-list" id="doneList"></ul>
    <p class="empty-msg" id="doneEmpty">עדיין לא סימנתם כלום כנקנה</p>
  </section>

  <p class="settings-link"><button id="settingsBtn" type="button">⚙️ חיבור ל-Google Sheets</button></p>

</main>

<div id="toastRoot"></div>

<script src="script.js"></script>
</body>
</html>
